[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-depth-flash-loop"
version = "0.5.0"
description = "Recursive Depth Flash Loop (RDFL): Byte-level O(1)-memory pure-recurrent architecture (Micro-DeltaProduct, P=4 Macro+StepReasoner halting, causal surprise-gated M2 OWM-GDN, decoupled K3/MTP-3, and calibrated RSI)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0", "mypy>=1.10.0", "pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["rdfl*"]

[tool.ruff]
line-length = 100
target-version = "py311"
